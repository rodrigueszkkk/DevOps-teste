version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: db-rm564578
    environment:
      POSTGRES_DB: orbitguard_db
      POSTGRES_USER: orbit_admin
      POSTGRES_PASSWORD: orbit_password
    ports:
      - "5432:5432"
    networks:
      - orbitguard-network
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: app-rm564578
    depends_on:
      - db
    ports:
      - "8080:8080"
    networks:
      - orbitguard-network
    environment:
      - DB_URL=jdbc:postgresql://db:5432/orbitguard_db
      - DB_USER=orbit_admin
      - DB_PASS=orbit_password
      - DB_DRIVER=org.postgresql.Driver

networks:
  orbitguard-network:
    driver: bridge

volumes:
  pgdata: