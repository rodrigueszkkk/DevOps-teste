spring.application.name=orbitguard-api

server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:orbitguard;MODE=Oracle;DATABASE_TO_UPPER=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# driver-class-name is omitted so Spring Boot auto-detects from the URL (h2 or mysql)

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

orbitguard.jwt.secret=orbitguard-global-solution-2026-uma-chave-local-de-desenvolvimento
orbitguard.jwt.expiration-minutes=240
orbitguard.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8081
